[package]
name = "medflow-keymaker-core"
version = "1.0.0"
description = "MedFlow Key Maker security core: encrypted vault, TOTP, lockout, recovery codes, key issuance and history. No Tauri, fully host-testable."
edition = "2021"
publish = false

[dependencies]
# The exact key format + signing code the desktop verifier uses.
medflow-license = { path = "../../../crates/medflow-license" }
# Same BIP39 crate the license crate uses; only for per-word hints while typing a phrase.
bip39 = "2.2"
# Vault + backup encryption: Argon2id (memory-hard KDF) -> AES-256-GCM.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
aes-gcm = "0.10.3"
# TOTP (RFC 6238 / RFC 4226): HMAC-SHA1, what every authenticator app speaks.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
getrandom = "0.2"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
